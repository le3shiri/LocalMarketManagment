name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, intl, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test

      - name: Check migrations are reversible
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/rollback.sqlite
        run: |
          touch "$DB_DATABASE"
          php artisan migrate --force
          php artisan migrate:rollback --step=1000 --force
          php artisan migrate --force

  # Same suite on the database the shop really uses (XAMPP ships MariaDB 10.4).
  phpunit-mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: localmarket_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: localmarket_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      BACKUP_MYSQLDUMP: mysqldump
      BACKUP_MYSQL: mysql

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl, zip, gd
          coverage: none

      - name: Install MariaDB client tools (mysqldump for the backup tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q mariadb-client

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite on MariaDB
        run: php artisan test

      - name: Check migrations are reversible on MariaDB
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1000 --force
          php artisan migrate --force
